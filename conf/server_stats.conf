#|                                                                                             |
#'---------------------------------------------------------------------------------------------'

#.---------.
#| default |
#'---------'
OUTPUT_RILEVAZIONE_DIR="$BASE_DIR/logs"
OUTPUT_SINTESI_DIR="$BASE_DIR/logs.sintesi"
OUTPUT_STATISTICA_DIR="$BASE_DIR/images"
homeInstallGnuPlot="/opt/apps/__extra_packages__/gnuplot-6.0.5-bin.i386/"
LOG_FS="/opt/apps/apache/logs"
CPU_INTERVAL=1

#===--- EOF


